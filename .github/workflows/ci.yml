name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # EDGAR requires a contact address; CI never calls the live API (network
  # tests are deselected) but Settings validates this at construction, so the
  # value must be present and must not look like the placeholder.
  EDGAR_USER_AGENT: "Filing Intelligence CI ci@filing-intelligence.invalid"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the CUDA build is ~2GB and pointless on a runner.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ml,llm,serve]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src

      - name: Tests
        # Network-marked tests hit the live SEC API. Running them here would
        # add load to a public service on every push and make CI fail when
        # EDGAR is slow, so they are deselected.
        run: pytest -m "not network" --cov=src --cov-report=term-missing --cov-fail-under=55


  stack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose and observability config
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          echo "compose valid"

      - name: Check Prometheus rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/cfg" \
            --entrypoint promtool prom/prometheus:v2.54.1 check rules /cfg/alerts.yml

      - name: Check Alertmanager config
        run: |
          docker run --rm -v "$PWD/deploy/alertmanager:/cfg" \
            --entrypoint amtool prom/alertmanager:v0.27.0 check-config /cfg/alertmanager.yml

      - name: Bring up datastores and apply schema
        run: |
          docker compose -f deploy/docker-compose.yml up -d minio postgres redis mongo
          for i in $(seq 1 30); do
            if docker compose -f deploy/docker-compose.yml ps --format json | grep -q healthy; then break; fi
            sleep 5
          done
          docker compose -f deploy/docker-compose.yml ps

  dags:
    # A separate job with no application dependencies installed, because
    # Airflow's constraints file downgrades typing_extensions, click and
    # pathspec - which breaks pydantic_core at import and takes the whole
    # application down. Sharing a virtualenv between the app and Airflow is
    # what made this step fail; isolation is the fix, not pinning.
    #
    # Isolation is viable because DAG parsing needs only airflow and pendulum:
    # every src import in dags/ is function-local, so the module body never
    # touches application code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Airflow only
        run: |
          pip install "apache-airflow==2.10.5" --constraint             "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"

      - name: Every DAG parses
        env:
          AIRFLOW_HOME: /tmp/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: |
          python - <<'EOF'
          from airflow.models import DagBag

          bag = DagBag("dags", include_examples=False)
          if bag.import_errors:
              for path, err in bag.import_errors.items():
                  print(f"IMPORT ERROR {path}: {err}")
              raise SystemExit(1)

          expected = {"ingest_edgar_filings", "process_filings", "extract_and_evaluate"}
          found = set(bag.dags)
          assert found == expected, f"expected {expected}, found {found}"
          for name, dag in sorted(bag.dags.items()):
              print(f"{name}: {len(dag.tasks)} tasks, schedule={dag.schedule_interval}")
          EOF

