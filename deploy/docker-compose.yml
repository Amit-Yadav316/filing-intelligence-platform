# Local stack for the Filing Intelligence Platform.
#
# Services arrive on the day that first needs them, so each day's gate is passed
# against a stack that actually exists: MinIO and Postgres for ingest and
# indexing, Redis for the embedding cache. Mongo, Prometheus, Grafana and
# AlertManager follow on days 5 and 6.
#
# Credentials here are local development defaults and match the defaults in
# src/config/settings.py. They are not secrets. A deployment injects real ones
# through the environment; nothing reads a credential from this file in anger.
#
# Note on the MinIO image: `minio/minio` on Docker Hub is no longer publicly
# pullable, so images come from quay.io, which is MinIO's own registry.

name: filing-intel

services:
  minio:
    # Pinned. `latest` on an object store is how a corpus becomes unreadable
    # after an unrelated `docker compose pull`.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: filing-intel-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API - what boto3 talks to
      - "9001:9001"   # web console, for eyeballing a landed partition
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Creates the bucket and exits. Without this, `make up` leaves you with a
  # running object store and nowhere to put anything, which fails the
  # "runs on clone" promise in the README.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: filing-intel-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/filings &&
      mc version enable local/filings &&
      echo 'bucket filings ready, versioning enabled' "
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: filing-intel-postgres
    environment:
      POSTGRES_USER: filing
      POSTGRES_PASSWORD: filing
      POSTGRES_DB: filings
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory only.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filing -d filings"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: filing-intel-redis
    # Embedding cache, not a database. `allkeys-lru` means a full cache evicts
    # cold entries instead of refusing writes, and the pipeline degrades to
    # recomputing an embedding rather than failing the DAG.
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: filing-intel-mongo
    environment:
      MONGO_INITDB_DATABASE: filings
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # --- observability ------------------------------------------------------
  # Airflow tasks are batch jobs that exit before a scrape can reach them, so
  # they push metrics here instead of being pulled.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: filing-intel-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: filing-intel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # The API runs on the host during development, not in a container.
      - "host.docker.internal:host-gateway"
    depends_on:
      - pushgateway
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: filing-intel-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: filing-intel-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Dashboards are provisioned from version control, never clicked together
      # by hand - a dashboard that exists only in someone's browser is not an
      # artefact of the system.
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  mongo-data:
  prometheus-data:
  grafana-data:
