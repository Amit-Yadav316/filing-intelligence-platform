[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filing-intelligence-platform"
version = "0.1.0"
description = "SEC filing ingestion, structural chunking, hybrid retrieval and LLM extraction scored against XBRL ground truth."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# Core: everything Day 1-2 needs. Deliberately light so the ingest and parse
# path installs without pulling a CUDA-sized dependency tree.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "boto3>=1.34",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Day 3: embeddings, vector + BM25 indexes, cache.
ml = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "redis>=5.0",
    "numpy>=1.26",
]

# Day 4+: schema-constrained extraction. Provider chosen at runtime.
llm = [
    "anthropic>=0.34",
    "openai>=1.40",
    "langchain-core>=0.3",
]

# Day 5: orchestration. Installed into the Airflow image, not the dev venv.
orchestration = [
    "apache-airflow>=2.9",
]

# Day 7: the API surface.
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pymongo>=4.7",
]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-tabulate",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: hits the live SEC EDGAR API; deselected by default with -m 'not network'",
    "slow: takes more than a few seconds",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["^dags/", "^tests/fixtures/"]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]
