line-length = 100
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[lint.per-file-ignores]
"tests/*" = ["ARG"]          # pytest fixtures are passed but not always referenced
"dags/*" = ["ARG", "B008"]   # Airflow decorators shadow these patterns

# RUF001 flags "ambiguous" Unicode - smart quotes, en dashes - which is a good
# default for source code but wrong in exactly these files. Real EDGAR filings
# are full of that typography, and handling it correctly is what this code and
# these tests are for. Suppressing it here keeps the check meaningful elsewhere.
"src/parse/table_extractor.py" = ["RUF001"]
"src/chunk/structural_chunker.py" = ["RUF001"]
"tests/test_parse.py" = ["ARG", "RUF001"]

[lint.isort]
known-first-party = ["src"]
